set-option -g history-limit 10000000
set -g pane-scrollbars on
set -g mouse on

# agent-deck configuration
# agent-deck-tmux-config-version: 3
# Added by agent-deck installer - 2026-05-29
# https://github.com/asheshgoplani/agent-deck

# Terminal with true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm*:Tc:smcup@:rmcup@"
set -ag terminal-overrides ",*256col*:Tc"

# Performance
set -sg escape-time 0

# Pass terminal focus in/out events to the running app (TUIs like Claude Code
# use them to know when the pane is active)
set -g focus-events on

# Extended keys: forward Shift+Enter and other modified keys to apps (tmux 3.2+)
set -s extended-keys on
set -as terminal-features 'tmux-256color:extkeys'

# Mouse support (scroll + drag-to-copy)
set -g mouse on

# Auto-enter copy-mode when scrolling up (critical for WSL compatibility)
# This handles: 1) apps with mouse support, 2) already in copy-mode, 3) normal pane
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# Scroll bindings in copy-mode (both vi and emacs modes)
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down
bind-key -T copy-mode WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X scroll-down

# Clipboard integration (drag-to-copy)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
# End agent-deck configuration

# Clipboard. Kept outside the agent-deck block so its installer can't drop it.
#
# tmux's built-in set-clipboard sends the OSC 52 escape to the terminal, and
# VTE (Ptyxis, GNOME Terminal) silently ignores it. So nothing a copy command
# picks up ever reaches the Wayland clipboard on its own.
#
# copy-command is the shell command every bare copy-pipe falls back to, which
# covers the stock Enter binding and anything else that copies without naming
# a target.
set -g copy-command 'wl-copy'

# vi users expect y to yank; tmux only binds Enter.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
